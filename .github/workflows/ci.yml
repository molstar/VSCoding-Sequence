name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # pretest compiles and lints; VS Code needs a display on Linux
      - run: xvfb-run -a npm run test:coverage
      - name: Enforce coverage threshold
        run: node -e "const p=require('./coverage/coverage-summary.json').total.lines.pct; console.log('lines:', p + '%'); if (p < 85) process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
